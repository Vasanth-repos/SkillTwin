name: SkillTwin CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package.json
            client/package.json

      - name: Install Server Dependencies & Run Unit/E2E Tests
        working-directory: ./server
        run: |
          npm ci
          node prisma/seed.js
          npm test

      - name: Install Client Dependencies & Run Production Build
        working-directory: ./client
        run: |
          npm ci
          npm run build
